name: KREVUNO Cloudflare Deploy

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'cloudflare/worker/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/krevuno-cloudflare-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: krevuno-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test before deploy
        run: |
          npm test
          node --check public/app.js
          node --check public/marketplace.js
          node --check public/global.js
          node --check cloudflare/worker/src/index.js
          node --check cloudflare/worker/src/ingest.js
          node --check cloudflare/worker/src/country-ingest.js
          node --check cloudflare/worker/src/runtime.js
          npx wrangler deploy --dry-run

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not configured."
            exit 42
          fi

      - name: Deploy KREVUNO production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
