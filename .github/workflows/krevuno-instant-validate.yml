name: KREVUNO Instant Engine Validate

on:
  push:
    branches:
      - agent/krevuno-instant-local-engine-release
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax checks
        run: |
          node --check public/instant-engine.js
          node --check public/global.js
          node --check cloudflare/worker/src/krevuno-job-page.js
          node --check cloudflare/worker/src/index.js
      - name: Install locked dependencies
        run: npm ci
      - name: Existing Worker regression tests
        run: npm run test:worker
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run
      - name: KREVUNO UI and safety contract checks
        run: |
          grep -q 'KREVUNO INSTANT MATCH' public/index.html
          grep -q 'instantVoiceNote' public/index.html
          grep -q 'dot need' public/index.html
          grep -q 'dot worker' public/index.html
          grep -q 'krevuno_nearby_map' public/instant-engine.js
          grep -q '50-mile' public/index.html
          grep -q 'microphone=(self)' cloudflare/worker/src/index.js
          grep -q 'round(d.item_lat::numeric,1)' supabase/migrations/006_krevuno_nearby_and_public_jobs.sql
          if grep -q "unitText:'HOUR'" cloudflare/worker/src/krevuno-job-page.js; then exit 1; fi
          if grep -q "name:'KREVUNO marketplace'" cloudflare/worker/src/krevuno-job-page.js; then exit 1; fi
